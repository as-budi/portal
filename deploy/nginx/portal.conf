# Konfigurasi AKHIR portal reslab-csub.cloud (setelah sertifikat Let's Encrypt terbit).
# Satu VPS dengan IoT Platform (iot.) dan MQTT Client (mqtt.); berkas ini ditambahkan di samping
# konfigurasi keduanya.
#
#   http://reslab-csub.cloud, http://www.…   -> https://reslab-csub.cloud (kecuali validasi certbot)
#   https://www.reslab-csub.cloud             -> https://reslab-csub.cloud
#   https://reslab-csub.cloud                 -> file statis di /srv/portal/site
#
# Halaman statis tanpa JavaScript, cookie, atau form: Content-Security-Policy dibuat seketat
# mungkin. Bila nanti menambah skrip/gambar dari luar, CSP di bawah harus ikut diubah.

server {
    listen 80;
    listen [::]:80;
    server_name reslab-csub.cloud www.reslab-csub.cloud;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://reslab-csub.cloud$request_uri;
    }
}

# www -> domain utama (sertifikat yang sama memuat kedua nama).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.reslab-csub.cloud;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/reslab-csub.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reslab-csub.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://reslab-csub.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name reslab-csub.cloud;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/reslab-csub.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reslab-csub.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_PORTAL:5m;
    ssl_session_timeout 1d;

    root /srv/portal/site;
    index index.html;
    charset utf-8;
    autoindex off;
    client_max_body_size 1k;          # tidak ada unggahan apa pun

    # --- Header keamanan --------------------------------------------------------------
    # HSTS 1 tahun, SENGAJA tanpa includeSubDomains/preload: header di domain utama dengan
    # includeSubDomains memaksa SEMUA subdomain *.reslab-csub.cloud ke HTTPS di browser
    # selama setahun. Aktifkan nanti bila yakin (docs/pasang-di-server.md, bagian 8).
    set $portal_hsts "max-age=31536000";
    set $portal_csp "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    add_header Strict-Transport-Security $portal_hsts always;
    add_header Content-Security-Policy $portal_csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;

    error_page 404 /404.html;

    # Hanya GET dan HEAD (halaman statis). Metode lain -> 405.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Berkas tersembunyi (.git, .env, .DS_Store, ...) tidak pernah dilayani, kecuali /.well-known/.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location = /.well-known/security.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # CSS, gambar: disimpan browser 1 hari (nama berkas tanpa hash, jadi jangan terlalu lama).
    # add_header di dalam location MENGGANTIKAN yang di level server, jadi header keamanan
    # ditulis ulang di sini.
    location /assets/ {
        try_files $uri =404;
        expires 1d;
        add_header Strict-Transport-Security $portal_hsts always;
        add_header Content-Security-Policy $portal_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Resource-Policy same-origin always;
    }

    location / {
        try_files $uri $uri/ =404;
        # HTML selalu diperiksa ulang ke server (expires -1 = Cache-Control: no-cache),
        # supaya perubahan langsung terlihat.
        expires -1;
        add_header Strict-Transport-Security $portal_hsts always;
        add_header Content-Security-Policy $portal_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
    }
}
