# TAHAP AWAL portal reslab-csub.cloud (sebelum ada sertifikat HTTPS), hanya untuk certbot.
# Setelah sertifikat terbit, ganti berkas ini dengan portal.conf (docs/pasang-di-server.md).
#
# Server default (menolak host tak dikenal) sudah ada di konfigurasi IoT Platform;
# berkas ini TIDAK memakai default_server.

server {
    listen 80;
    listen [::]:80;
    server_name reslab-csub.cloud www.reslab-csub.cloud;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        default_type text/plain;
        return 503 "reslab-csub.cloud: HTTPS is not set up yet.\n";
    }
}
